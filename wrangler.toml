name = "telegram-shop"
main = "worker.js"
compatibility_date = "2024-11-01"

# شناسهٔ دیتابیس D1 را بعد از ساخت آن در Cloudflare جایگزین کنید.
[[d1_databases]]
binding = "DB"
database_name = "shop-db"
database_id = "4806752b-5fa9-4b5b-8775-9efef41e7100"

# اتصال دستیار هوشمند رایگان Cloudflare
[ai]
binding = "AI"
