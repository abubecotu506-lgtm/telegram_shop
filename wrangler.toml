name = "telegram-shop"
main = "worker.js"
compatibility_date = "2024-11-01"

# شناسهٔ دیتابیس D1 را بعد از ساخت آن در Cloudflare جایگزین کنید.
[[d1_databases]]
binding = "DB"
database_name = "shop-db"
database_id = "DATABASE_ID_HERE"

# اتصال Workers AI (سهمیهٔ روزانهٔ رایگان محدود است؛ مصرف بیشتر می‌تواند هزینه داشته باشد)
[ai]
binding = "AI"

# نرخ مرجع دلار فقط برای اطلاع مدیر، هر ۱۵ دقیقه تازه می‌شود؛ قیمت محصولات تغییر نمی‌کند.
[triggers]
crons = ["*/15 * * * *"]
